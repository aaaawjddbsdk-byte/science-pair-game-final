<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>과학기술의 발전: 과거 vs 현대 짝맞추기</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;800;900&display=swap" rel="stylesheet">
<style>
  :root {
    color-scheme: light;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
    --ink: #1e2a78;
    --ink-soft: #3b4cca;
    --navy-1: #2b3a8c;
    --navy-2: #121a40;
    --bg: #f8fafc;
    --blue: #4f6df5;
    --green-bg: #f0fdf4;
    --green-line: #86d9a5;
    --past: #92400e;
    --past-bg: #fef3c7;
    --past-line: #f4d27a;
    --modern-bg: #e0e7ff;
    --modern: #3730a3;
    --text: #1f2937;
    --muted: #6b7280;
  }
  *, *::before, *::after { box-sizing: border-box; }
  html { scroll-padding-top: env(safe-area-inset-top, 0px); }
  body {
    margin: 0;
    background-color: var(--bg);
    background-image: radial-gradient(#cfd8ec 1px, transparent 1px);
    background-size: 22px 22px;
    color: var(--text);
    font-family: "Noto Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
    min-height: 100vh;
    -webkit-font-smoothing: antialiased;
  }
  button { font-family: inherit; cursor: pointer; }
  .wrap { max-width: 1020px; margin: 0 auto; padding: 18px 16px 40px; }

  /* Header */
  header { text-align: center; }
  .badge {
    display: inline-flex; align-items: center; gap: 6px;
    background: #fff; border: 1.5px solid #c7d2fe; color: var(--ink-soft);
    border-radius: 999px; padding: 6px 16px; font-size: 12.5px; font-weight: 700;
  }
  h1 {
    margin: 8px 0 14px; color: var(--ink); font-weight: 900;
    font-size: clamp(24px, 5.2vw, 44px); line-height: 1.25; letter-spacing: -0.02em;
  }

  /* Status bar */
  .bar {
    background: #fff; border: 1px solid #e8edf7; border-radius: 18px;
    box-shadow: 0 6px 24px rgba(30, 42, 120, .07);
    padding: 12px 16px; display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
    margin-bottom: 18px;
  }
  .who { display: flex; align-items: center; gap: 8px; flex: 1 1 150px; min-width: 130px; }
  .wname { font-weight: 800; font-size: 15px; color: var(--ink); overflow-wrap: anywhere; }
  .stats { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; flex: 2 1 300px; }
  .chip {
    display: inline-flex; align-items: center; gap: 6px; border-radius: 10px;
    padding: 7px 12px; font-size: 12.5px; font-weight: 700; border: 1px solid #dbe3fb;
    background: #eef2ff; color: var(--ink-soft); white-space: nowrap;
  }
  .chip b { font-variant-numeric: tabular-nums; font-weight: 800; }
  .chip.ok { background: #ecfdf3; border-color: #bbf0cf; color: #166534; }
  .tools { display: flex; gap: 8px; margin-left: auto; }
  .btn-soft {
    border: 0; background: #f1f3f9; color: #374151; font-weight: 700; font-size: 12.5px;
    padding: 8px 12px; border-radius: 10px; display: inline-flex; align-items: center; gap: 5px;
  }
  .btn-soft:hover { background: #e5e9f4; }

  /* Board */
  .board { display: grid; grid-template-columns: repeat(5, 1fr); gap: 12px; perspective: 1200px; }
  .card {
    position: relative; aspect-ratio: 1.5 / 1; border: 0; padding: 0; background: none;
    border-radius: 14px; outline-offset: 3px;
  }
  .inner {
    position: absolute; inset: 0; transform-style: preserve-3d;
    transition: transform .45s cubic-bezier(.3, .7, .3, 1);
  }
  .card.open .inner, .card.matched .inner { transform: rotateY(180deg); }
  .face {
    position: absolute; inset: 0; border-radius: 14px; backface-visibility: hidden; -webkit-backface-visibility: hidden;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px;
  }
  .back {
    background: linear-gradient(135deg, var(--navy-1), var(--navy-2));
    border: 2px solid var(--blue); color: #fff;
    box-shadow: 0 4px 12px rgba(30, 42, 120, .18);
  }
  .back span { font-size: 11px; font-weight: 700; letter-spacing: .01em; }
  .card:not(.open):not(.matched):hover .back { filter: brightness(1.18); }
  .front {
    transform: rotateY(180deg); background: #fff; border: 2px solid #a5b4fc;
    box-shadow: 0 4px 12px rgba(30, 42, 120, .1);
  }
  .card.matched .front { background: var(--green-bg); border-color: var(--green-line); }
  .tag { font-size: 10.5px; font-weight: 800; color: #fff; border-radius: 999px; padding: 2px 10px; }
  .tag.modern { background: linear-gradient(90deg, #3b5bdb, #4f6df5); }
  .tag.past { background: linear-gradient(90deg, #92400e, #b45309); }
  .emo { font-size: clamp(22px, 3.4vw, 32px); line-height: 1; }
  .nm { font-size: clamp(11px, 1.35vw, 13.5px); font-weight: 800; color: #111827; text-align: center; padding: 0 4px; line-height: 1.25; }
  .card.shake .inner { animation: shake .35s; }
  @keyframes shake { 0%,100% { translate: 0 } 25% { translate: -4px 0 } 75% { translate: 4px 0 } }

  /* Panels */
  .panel {
    background: #fff; border: 1px solid #e8edf7; border-radius: 26px; padding: 26px 28px 30px;
    box-shadow: 0 10px 34px rgba(30, 42, 120, .09);
  }
  .actions { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 24px; }
  .act { border: 0; border-radius: 12px; padding: 13px 18px; font-weight: 800; font-size: 14px; display: inline-flex; align-items: center; gap: 8px; }
  .act.study { background: #b9741a; color: #fff; }
  .act.next { background: #283a7d; color: #fff; }
  .act.ghost { background: #fff; color: var(--ink-soft); border: 1.5px solid #c7d2fe; }
  .act:hover { filter: brightness(1.07); }

  /* Result */
  .win { text-align: center; max-width: 560px; margin: 0 auto; }
  .party { font-size: 34px; letter-spacing: 6px; display: flex; justify-content: center; gap: 6px; margin-bottom: 4px; }
  .party span { display: inline-block; animation: hop 1.4s ease-in-out infinite; }
  .party span:nth-child(2) { animation-delay: .15s; }
  .party span:nth-child(3) { animation-delay: .3s; }
  .party span:nth-child(4) { animation-delay: .45s; }
  .party span:nth-child(5) { animation-delay: .6s; }
  @keyframes hop { 0%, 60%, 100% { transform: translateY(0) } 30% { transform: translateY(-12px) rotate(-8deg) } }
  .pill-ok {
    display: inline-flex; align-items: center; gap: 6px; background: #d1fae5; color: #065f46;
    font-weight: 800; font-size: 12.5px; border-radius: 999px; padding: 6px 14px;
  }
  .win h2 { margin: 12px 0 6px; font-size: clamp(22px, 4vw, 32px); color: var(--ink); font-weight: 900; }
  .win .who2 { font-size: 15px; color: #374151; font-weight: 700; overflow-wrap: anywhere; }
  .score { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin: 22px 0 6px; }
  .box {
    border-radius: 20px; padding: 20px 10px; background: #eef2ff; border: 1.5px solid #dbe3fb;
    display: flex; flex-direction: column; gap: 6px; align-items: center;
  }
  .box span { font-size: 13px; font-weight: 800; color: var(--ink-soft); }
  .box b { font-size: clamp(28px, 7vw, 40px); font-weight: 900; color: var(--ink); font-variant-numeric: tabular-nums; }
  .win .actions { justify-content: center; }

  /* Study view */
  .study-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; margin-top: 18px; }
  .pair { display: flex; align-items: center; gap: 8px; background: #f5f8ff; border: 1.5px solid #dbe5fb; border-radius: 18px; padding: 12px; }
  .pair .arrow { color: var(--blue); font-weight: 900; font-size: 20px; }
  .mini { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 6px; border-radius: 14px; padding: 9px 6px 11px; background: #fff; border: 1.5px solid; }
  .mini.past { border-color: var(--past-line); }
  .mini.modern { border-color: #b7c6f6; }
  .mini .tg { font-size: 10.5px; font-weight: 800; border-radius: 999px; padding: 2px 10px; }
  .mini.past .tg { background: var(--past-bg); color: var(--past); }
  .mini.modern .tg { background: var(--modern-bg); color: var(--modern); }
  .mini .e { font-size: 24px; line-height: 1.1; }
  .mini .n { font-size: 12px; font-weight: 800; color: #111827; text-align: center; }

  /* Intro */
  .intro { max-width: 520px; margin: 8px auto 0; text-align: center; padding: 34px 32px 36px; }
  .intro .ic { width: 84px; height: 84px; border-radius: 50%; background: #dbe5fb; display: grid; place-items: center; font-size: 38px; margin: 0 auto 18px; }
  .intro h2 { margin: 0 0 10px; font-size: 24px; font-weight: 900; color: #111827; }
  .intro p { margin: 0 0 22px; font-size: 13.5px; line-height: 1.7; color: var(--muted); }
  .intro label { display: block; text-align: left; font-size: 12.5px; font-weight: 800; color: #111827; margin-bottom: 8px; }
  .intro input {
    width: 100%; border: 2px solid #c7d2fe; border-radius: 14px; padding: 16px 16px; font: inherit; font-size: 16px;
    font-weight: 700; text-align: center; color: var(--ink); background: #fff; outline: none;
  }
  .intro input:focus-visible { border-color: var(--ink); box-shadow: 0 0 0 3px rgba(79, 109, 245, .2); }
  .intro input.need { animation: shake .4s; border-color: #ef4444; }
  .intro .go {
    width: 100%; margin-top: 18px; border: 0; border-radius: 14px; padding: 17px; background: #2d3a85; color: #fff;
    font-weight: 800; font-size: 16px; box-shadow: 0 6px 16px rgba(45, 58, 133, .3);
  }
  .intro .go:hover { filter: brightness(1.1); }

  .toast {
    position: fixed; left: 50%; bottom: calc(24px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%);
    background: #1f2937; color: #fff; font-weight: 700; font-size: 13.5px; padding: 11px 18px; border-radius: 12px;
    opacity: 0; pointer-events: none; transition: opacity .25s; z-index: 10; max-width: 90vw; text-align: center;
  }
  .toast.show { opacity: 1; }
  .hidden { display: none !important; }

  @media (max-width: 820px) { .study-grid { grid-template-columns: repeat(2, 1fr); } }
  @media (max-width: 640px) {
    .board { grid-template-columns: repeat(4, 1fr); gap: 8px; }
    .card { aspect-ratio: 3 / 4; }
    .back span { font-size: 9px; }
    .tag { font-size: 9px; padding: 2px 6px; }
    .nm { font-size: 10.5px; padding: 0 2px; }
    .panel { padding: 20px 14px 24px; border-radius: 20px; }
    .intro { padding: 26px 18px 28px; }
    .study-grid { grid-template-columns: 1fr; }
    .tools { margin-left: 0; width: 100%; }
    .tools .btn-soft { flex: 1; justify-content: center; }
  }
  @media (prefers-reduced-motion: reduce) {
    .inner { transition: none; }
    .card.shake .inner, .intro input.need, .party span { animation: none; }
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="badge">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M4.2 4.2l2.1 2.1M17.7 17.7l2.1 2.1M2 12h3M19 12h3M4.2 19.8l2.1-2.1M17.7 6.3l2.1-2.1"/></svg>
      중등 도덕 / 과학 기술의 발전
    </div>
    <h1>과학 기술의 발전: 과거 vs 현대 짝맞추기 🚀</h1>
  </header>

  <!-- INTRO -->
  <section id="intro" class="panel intro">
    <div class="ic" aria-hidden="true">🧒</div>
    <h2>학생 이름을 입력하세요</h2>
    <p>과거와 현대에 사용했던 과학기술 10쌍을 맞춰보세요!<br>걸린 시간과 시도 횟수가 기록됩니다.</p>
    <label for="name">학생 이름</label>
    <input id="name" type="text" maxlength="12" placeholder="예: 홍길동" autocomplete="off">
    <button class="go" type="button" id="btnStart">게임 시작하기 ▶</button>
  </section>

  <!-- GAME -->
  <section id="game" class="hidden">
    <div class="bar">
      <div class="who">
        <span aria-hidden="true">🧬</span>
        <span class="wname" id="whoName"></span>
      </div>
      <div class="stats">
        <div class="chip">⏱ 시간: <b id="time">0.0초</b></div>
        <div class="chip">👆 시도: <b id="tries">0회</b></div>
        <div class="chip ok">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M8 12.5l3 3 5-6"/></svg>
          맞춘 짝: <b id="found">0/10</b>
        </div>
      </div>
      <div class="tools">
        <button class="btn-soft" id="btnRestart" type="button">↻ 다시하기</button>
      </div>
    </div>
    <div class="board" id="board" role="group" aria-label="카드 20장"></div>
  </section>

  <!-- RESULT -->
  <section id="result" class="panel hidden">
    <div class="win">
      <div class="party" aria-hidden="true"><span>🎉</span><span>🎊</span><span>🏆</span><span>🎊</span><span>🎉</span></div>
      <span class="pill-ok">게임 성공!</span>
      <h2>축하합니다! 모든 짝을 맞췄습니다!</h2>
      <div class="who2" id="winWho"></div>
      <div class="score">
        <div class="box"><span>⏱ 걸린 시간</span><b id="rTime"></b></div>
        <div class="box"><span>👆 시도 횟수</span><b id="rTries"></b></div>
      </div>
      <div class="actions">
        <button class="act study" type="button" id="btnStudy">📖 과학 기술의 발전 10쌍 학습하기</button>
        <button class="act next" type="button" id="btnNext">➕ 다음 학생 도전하기</button>
      </div>
    </div>
  </section>

  <!-- STUDY -->
  <section id="study" class="panel hidden">
    <h3 style="margin:0;font-size:20px;color:var(--ink);font-weight:900">📖 과학 기술의 발전 10쌍 학습하기</h3>
    <div class="study-grid" id="studyGrid"></div>
    <div class="actions">
      <button class="act ghost" type="button" id="btnStudyBack">← 돌아가기</button>
      <button class="act next" type="button" id="btnStudyNext">➕ 다음 학생 도전하기</button>
    </div>
  </section>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
(function () {
  var PAIRS = [
    { past: { n: '우편', e: '✉️' },        modern: { n: '카카오톡', e: '💬' } },
    { past: { n: '부채', e: '🪭' },        modern: { n: '에어컨', e: '🌬️' } },
    { past: { n: '활', e: '🏹' },          modern: { n: '대포', e: '💥' } },
    { past: { n: '경비원', e: '👮' },      modern: { n: 'CCTV', e: '📹' } },
    { past: { n: '일반 수술', e: '🏥' },   modern: { n: '로봇 수술', e: '🤖' } },
    { past: { n: '지도', e: '🗺️' },       modern: { n: '내비게이션', e: '📍' } },
    { past: { n: '양피지', e: '📜' },      modern: { n: '책(인쇄술)', e: '📖' } },
    { past: { n: '봉화', e: '🔥' },        modern: { n: '재난문자', e: '🚨' } },
    { past: { n: '마당극', e: '🎭' },      modern: { n: '영화', e: '🎬' } },
    { past: { n: '석빙고', e: '🧊' },      modern: { n: '냉장고', e: '❄️' } }
  ];

  var $ = function (id) { return document.getElementById(id); };
  var esc = function (s) { return String(s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); };
  var ATOM = '<svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.7" aria-hidden="true"><circle cx="12" cy="12" r="1.8" fill="#fff"/><ellipse cx="12" cy="12" rx="10" ry="4"/><ellipse cx="12" cy="12" rx="10" ry="4" transform="rotate(60 12 12)"/><ellipse cx="12" cy="12" rx="10" ry="4" transform="rotate(120 12 12)"/></svg>';

  var cards = [], open = [], lock = false, matched = 0, tries = 0;
  var startAt = 0, timer = null, finished = false, playerName = '';

  function fmt(ms) { return (ms / 1000).toFixed(1) + '초'; }
  var toastT;
  function toast(msg) {
    var t = $('toast'); t.textContent = msg; t.classList.add('show');
    clearTimeout(toastT); toastT = setTimeout(function () { t.classList.remove('show'); }, 2200);
  }
  function show(view) {
    ['intro', 'game', 'result', 'study'].forEach(function (v) { $(v).classList.toggle('hidden', v !== view); });
    window.scrollTo({ top: 0 });
  }
  function shuffle(a) { for (var i = a.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)); var t = a[i]; a[i] = a[j]; a[j] = t; } return a; }

  function newGame() {
    clearInterval(timer); timer = null;
    open = []; lock = false; matched = 0; tries = 0; startAt = 0; finished = false;
    cards = [];
    PAIRS.forEach(function (p, i) {
      cards.push({ pair: i, kind: 'past', n: p.past.n, e: p.past.e });
      cards.push({ pair: i, kind: 'modern', n: p.modern.n, e: p.modern.e });
    });
    shuffle(cards);
    var board = $('board'); board.innerHTML = '';
    cards.forEach(function (c, idx) {
      var b = document.createElement('button');
      b.type = 'button'; b.className = 'card'; b.dataset.i = idx;
      b.setAttribute('aria-label', '카드 ' + (idx + 1) + ' (뒤집지 않음)');
      b.innerHTML =
        '<div class="inner">' +
          '<div class="face back">' + ATOM + '<span>과학 기술</span></div>' +
          '<div class="face front"><span class="tag ' + c.kind + '">' + (c.kind === 'past' ? '과거 생활' : '현대 생활') + '</span>' +
          '<span class="emo" aria-hidden="true">' + c.e + '</span><span class="nm">' + esc(c.n) + '</span></div>' +
        '</div>';
      b.addEventListener('click', function () { flip(idx, b); });
      c.el = b; board.appendChild(b);
    });
    updateStats();
  }
  function updateStats() {
    $('tries').textContent = tries + '회';
    $('found').textContent = matched + '/10';
    $('time').textContent = startAt ? fmt(Date.now() - startAt) : '0.0초';
  }
  function startTimer() {
    startAt = Date.now();
    timer = setInterval(function () { $('time').textContent = fmt(Date.now() - startAt); }, 100);
  }

  function flip(idx, el) {
    if (lock || finished) return;
    var c = cards[idx];
    if (el.classList.contains('open') || el.classList.contains('matched')) return;
    if (!startAt) startTimer();
    el.classList.add('open');
    el.setAttribute('aria-label', c.n + ' (' + (c.kind === 'past' ? '과거 생활' : '현대 생활') + ')');
    open.push(idx);
    if (open.length === 2) {
      tries++; lock = true;
      var a = cards[open[0]], b = cards[open[1]];
      if (a.pair === b.pair) {
        setTimeout(function () {
          a.el.classList.remove('open'); b.el.classList.remove('open');
          a.el.classList.add('matched'); b.el.classList.add('matched');
          matched++; open = []; lock = false; updateStats();
          if (matched === PAIRS.length) finish();
        }, 450);
      } else {
        setTimeout(function () { a.el.classList.add('shake'); b.el.classList.add('shake'); }, 350);
        setTimeout(function () {
          [a, b].forEach(function (x) {
            x.el.classList.remove('open', 'shake');
            x.el.setAttribute('aria-label', '카드 ' + (Number(x.el.dataset.i) + 1) + ' (뒤집지 않음)');
          });
          open = []; lock = false;
        }, 950);
      }
      updateStats();
    }
  }

  function finish() {
    finished = true; clearInterval(timer);
    var ms = Date.now() - startAt;
    $('time').textContent = fmt(ms);
    $('winWho').textContent = playerName + ' 학생';
    $('rTime').textContent = fmt(ms);
    $('rTries').textContent = tries + '회';
    show('result');
  }

  $('studyGrid').innerHTML = PAIRS.map(function (p) {
    return '<div class="pair">' +
      '<div class="mini past"><span class="tg">과거 생활</span><span class="e">' + p.past.e + '</span><span class="n">' + esc(p.past.n) + '</span></div>' +
      '<span class="arrow" aria-hidden="true">→</span>' +
      '<div class="mini modern"><span class="tg">현대 생활</span><span class="e">' + p.modern.e + '</span><span class="n">' + esc(p.modern.n) + '</span></div>' +
    '</div>';
  }).join('');

  function nextStudent() {
    playerName = ''; $('name').value = '';
    newGame(); show('intro'); $('name').focus();
  }
  function startGame() {
    var v = $('name').value.trim();
    if (!v) {
      var el = $('name');
      el.classList.remove('need'); void el.offsetWidth; el.classList.add('need');
      el.focus(); toast('이름을 입력해 주세요!');
      return;
    }
    playerName = v; $('whoName').textContent = v;
    newGame(); show('game');
  }
  $('btnStart').addEventListener('click', startGame);
  $('name').addEventListener('keydown', function (e) { if (e.key === 'Enter') startGame(); });
  $('name').addEventListener('input', function () { this.classList.remove('need'); });
  $('btnRestart').addEventListener('click', function () { newGame(); });
  $('btnNext').addEventListener('click', nextStudent);
  $('btnStudyNext').addEventListener('click', nextStudent);
  $('btnStudy').addEventListener('click', function () { show('study'); });
  $('btnStudyBack').addEventListener('click', function () { show('result'); });

  newGame();
  show('intro');
})();
</script>
</body>
</html>
